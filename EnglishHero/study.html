<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>English Hero - 單字資料夾管理</title>
  <link rel="stylesheet" href="css/style.css?v=2063">
  <style>
    .study-container { max-width: 700px; margin: 30px auto; padding: 20px; background: #fff; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    
    .folder-wrapper { position: relative; margin-bottom: 12px; border-radius: 8px; background: #e2e8f0; }
    .folder-item { border: 1px solid #e5e7eb; border-radius: 8px; padding: 16px; background: #f9fafb; display: flex; justify-content: space-between; align-items: center; position: relative; z-index: 2; transition: transform 0.2s ease; touch-action: pan-y; }
    .folder-info h3 { margin: 0 0 4px 0; color: #1e293b; font-size: 18px; }
    .folder-info p { margin: 0; color: #64748b; font-size: 13px; }
    
    .folder-actions-hidden { position: absolute; right: 0; top: 0; bottom: 0; display: flex; z-index: 1; align-items: center; background: #e2e8f0; padding-right: 4px; gap: 4px; border-radius: 8px; overflow: hidden; }
    .folder-actions-hidden button { padding: 6px 10px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 12px; color: #fff; height: 75%; }
    .btn-swipe-view { background: #3b82f6; }
    .btn-swipe-quiz { background: #8b5cf6; }
    .btn-swipe-del { background: #ef4444; }

    .desktop-actions { display: flex; align-items: center; }
    .dots-container { position: relative; }
    .dots-btn { background: none; border: none; font-size: 22px; cursor: pointer; color: #64748b; padding: 4px 8px; border-radius: 4px; }
    .dots-btn:hover { background: #e2e8f0; }
    
    .dropdown-menu { 
      position: absolute; 
      right: 0; 
      top: 110%; 
      background: #fff; 
      border: 1px solid #cbd5e1; 
      border-radius: 8px; 
      box-shadow: 0 8px 20px rgba(0,0,0,0.15); 
      display: none; 
      z-index: 9999; 
      min-width: 150px; 
      padding: 4px 0; 
    }
    .dropdown-menu.show { display: block; }
    .dropdown-menu button { display: block; width: 100%; text-align: left; padding: 10px 14px; background: none; border: none; cursor: pointer; font-size: 14px; color: #334155; }
    .dropdown-menu button:hover { background: #f1f5f9; }
    .dropdown-menu button.text-danger { color: #ef4444; }

    .word-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; border-bottom: 1px solid #f1f5f9; background: #fff; margin-top: 4px; border-radius: 6px; }
    
    .edit-modal-backdrop { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: flex; justify-content: center; align-items: center; z-index: 1000; }
    .edit-card { background: #fff; padding: 24px; border-radius: 12px; width: 90%; max-width: 450px; box-shadow: 0 10px 25px rgba(0,0,0,0.15); text-align: left; }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-weight: bold; margin-bottom: 6px; color: #334155; font-size: 14px; }
    .form-group input, .form-group select { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 15px; box-sizing: border-box; }
    .modal-btns { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
    .btn-save { background: #10b981; color: #fff; border: none; padding: 8px 16px; border-radius: 6px; font-weight: bold; cursor: pointer; }
    .btn-cancel { background: #94a3b8; color: #fff; border: none; padding: 8px 16px; border-radius: 6px; font-weight: bold; cursor: pointer; }

    @media (max-width: 768px) {
      .desktop-actions { display: none; }
    }
    @media (min-width: 769px) {
      .folder-item { transform: none !important; }
    }
  </style>
</head>
<body class="dashboard-body">

<header class="main-header">
  <div class="logo">
    <a href="index.html?v=2063" style="text-decoration: none; color: inherit;">📚 English Hero - 單字管理</a>
  </div>
  <div class="user-panel">
    <a href="index.html?v=2063" class="btn-back">回首頁</a>
  </div>
</header>

<div class="study-container">
  <div id="view-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
    <h2 id="page-title" style="margin: 0; color: #333;">📁 我的單字資料夾</h2>
    <button id="btn-back-folders" style="display: none; padding: 6px 12px; background: #64748b; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-weight: bold;">⬅️ 返回資料夾列表</button>
  </div>
  
  <div id="flashcard-container">
    <p style="color:#666; text-align: center;">載入中...</p>
  </div>
</div>

<div id="edit-modal-container"></div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script src="js/study.js?v=2063"></script>
</body>
</html>
