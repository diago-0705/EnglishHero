<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>English Hero - 背單字庫</title>
  <link rel="stylesheet" href="css/style.css">

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
</head>
<body class="study-body">

  <header class="study-header">
    <a href="index.html" class="btn-back">⬅ 回首頁</a>
    <div class="breadcrumb" id="breadcrumb-bar">
      <!-- 動態麵包屑導航 -->
    </div>
    <div style="width: 80px;"></div>
  </header>

  <main class="study-container">
    
    <!-- 操作工具列 -->
    <div class="toolbar">
      <button id="btn-create-subfolder" class="btn-secondary-action">+ 建立子資料夾</button>
      <button id="btn-add-word" class="btn-primary-action">+ 新增單字</button>
    </div>

    <!-- 子資料夾區域 -->
    <section class="subfolders-section">
      <h3>📁 資料夾清單</h3>
      <div id="subfolder-list" class="folder-grid"></div>
    </section>

    <!-- 翻卡背誦區 -->
    <section id="flashcard-section" class="flashcard-area hidden">
      <div id="card-inner" class="flashcard">
        <div class="card-front">
          <span class="card-tip">點擊翻面看中文 👆</span>
          <h3 id="card-word">Word</h3>
          <button id="btn-speak" class="btn-icon" title="發音">🔊 朗讀</button>
        </div>
        <div class="card-back">
          <h3 id="card-translation">中文翻譯</h3>
        </div>
      </div>
      <div class="card-nav">
        <button id="btn-prev-card" class="btn-secondary-action">上一個</button>
        <span id="card-counter">1 / 1</span>
        <button id="btn-next-card" class="btn-primary-action">下一個</button>
      </div>
    </section>

    <!-- 當前資料夾單字清單 -->
    <section class="word-list-table-container">
      <h3>📝 本層單字清單</h3>
      <table class="word-table">
        <thead>
          <tr>
            <th style="width: 45%;">英文單字</th>
            <th style="width: 40%;">中文解釋</th>
            <th style="width: 15%; text-align: center;">操作</th>
          </tr>
        </thead>
        <tbody id="word-table-body"></tbody>
      </table>
    </section>

  </main>

  <script src="js/study.js"></script>
</body>
</html>
