<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>English Hero - 背單字</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .study-container { max-width: 600px; margin: 40px auto; padding: 20px; background: #fff; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); text-align: center; }
    .word-card { border: 2px solid #e5e7eb; background: #f9fafb; padding: 30px; border-radius: 10px; margin-bottom: 20px; transition: 0.3s; }
    .word-card:hover { border-color: #3b82f6; background: #fff; box-shadow: 0 4px 10px rgba(59, 130, 246, 0.1); }
    .en-word { font-size: 32px; font-weight: bold; color: #1d4ed8; margin-bottom: 10px; }
    .ch-word { font-size: 20px; color: #4b5563; }
  </style>
</head>
<body class="dashboard-body">

<header class="main-header">
  <div class="logo">📚 English Hero - 背單字</div>
  <div class="user-panel">
    <a href="index.html" style="margin-right:15px; text-decoration:none; color:#333; font-weight:bold;">回首頁</a>
  </div>
</header>

<div class="study-container">
  <h2 style="color: #333; margin-bottom: 5px;">單字瀏覽</h2>
  <p style="color: #888; margin-bottom: 25px;">沒有時間壓力，慢慢看、慢慢背！</p>
  
  <!-- 這是未來要用 JavaScript 自動生成的字卡，先放一個當範例 -->
  <div id="flashcard-container">
    <div class="word-card">
      <div class="en-word">abandon</div>
      <div class="ch-word">放棄</div>
    </div>
  </div>
</div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

<script src="js/study.js?v=2"></script>
</body>
</html>
