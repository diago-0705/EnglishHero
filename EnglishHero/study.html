<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>English Hero - 單字資料夾管理</title>
  <link rel="stylesheet" href="css/style.css?v=2050">
  <style>
    .study-container { max-width: 700px; margin: 30px auto; padding: 20px; background: #fff; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    .folder-item { border: 1px solid #e5e7eb; border-radius: 8px; margin-bottom: 12px; padding: 16px; background: #f9fafb; display: flex; justify-content: space-between; align-items: center; }
    .folder-info h3 { margin: 0 0 4px 0; color: #1e293b; font-size: 18px; }
    .folder-info p { margin: 0; color: #64748b; font-size: 13px; }
    .btn-group button { margin-left: 6px; padding: 6px 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 13px; }
    .btn-view { background: #3b82f6; color: #fff; }
    .btn-del { background: #ef4444; color: #fff; }
    .word-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; border-bottom: 1px solid #f1f5f9; background: #fff; margin-top: 4px; border-radius: 6px; }
    .word-row:last-child { border-bottom: none; }
  </style>
</head>
<body class="dashboard-body">

<header class="main-header">
  <div class="logo">
    <a href="index.html?v=2050" style="text-decoration: none; color: inherit;">📚 English Hero - 單字管理</a>
  </div>
  <div class="user-panel">
    <a href="index.html?v=2050" class="btn-back">回首頁</a>
  </div>
</header>

<div class="study-container">
  <div id="view-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
    <h2 id="page-title" style="margin: 0; color: #333;">📁 我的單字資料夾</h2>
    <button id="btn-back-folders" style="display: none; padding: 6px 12px; background: #64748b; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-weight: bold;">⬅️ 返回資料夾列表</button>
  </div>
  
  <div id="flashcard-container">
    <p style="color:#666; text-align: center;">載入中...</p>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script src="js/study.js?v=2051"></script>
