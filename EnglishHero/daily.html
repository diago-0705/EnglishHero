<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>每日單字 - English Hero</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-gray-100 min-h-screen flex flex-col items-center p-4">
  
  <div class="max-w-md w-full bg-white rounded-2xl shadow-xl p-6 mt-10 text-center">
    <div class="text-sm text-indigo-600 font-bold mb-2">🌟 今日精選單字</div>
    
    <!-- 每日單字展示卡 -->
    <div id="daily-word-container" class="my-6 p-6 bg-indigo-50 rounded-xl border border-indigo-100">
      <h1 id="word-en" class="text-3xl font-extrabold text-gray-800 mb-2">載入中...</h1>
      <p id="word-pos" class="text-sm text-indigo-500 font-semibold mb-4"></p>
      <p id="word-ch" class="text-xl text-gray-600 font-medium"></p>
    </div>

    <div class="flex gap-3 mt-6">
      <button onclick="addToMyWords()" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-xl shadow transition">
        📥 收藏到我的字庫
      </button>
      <a href="index.html" class="flex-1 bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold py-3 px-4 rounded-xl flex items-center justify-center transition">
        🏠 回首頁
      </a>
    </div>
  </div>

  <!-- Firebase 相關 SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
  <script src="js/daily.js"></script>
</body>
</html>
