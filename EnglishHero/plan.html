<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>背單字計畫 - English Hero</title>
  <!-- 引入 Tailwind CSS 確保排版和格線精緻 -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-gradient-to-br from-indigo-50 via-slate-50 to-blue-100 min-h-screen flex flex-col items-center py-10 px-4">

  <!-- 頂部標題列 -->
  <div class="max-w-xl w-full flex justify-between items-center mb-6">
    <a href="index.html" class="flex items-center text-indigo-600 hover:text-indigo-800 font-semibold transition">
      <span class="mr-1">←</span> 返回首頁
    </a>
    <h1 class="text-xl font-extrabold text-gray-800">🎯 智慧背單字計畫</h1>
    <div class="w-16"></div> <!-- 佔位平衡 -->
  </div>

  <!-- 主卡片容器 -->
  <div class="max-w-xl w-full bg-white rounded-3xl shadow-xl border border-indigo-50 p-6 md:p-8">
    
    <!-- 設定表單區 -->
    <div class="space-y-5">
      <div>
        <label class="block text-gray-700 font-bold mb-2 flex items-center">
          <span class="bg-indigo-100 text-indigo-700 text-xs px-2 py-0.5 rounded-full mr-2">步驟 1</span> 選擇要背誦的題庫資料夾
        </label>
        <select id="folder-select" class="w-full p-4 bg-gray-50 border border-gray-200 rounded-2xl focus:ring-2 focus:ring-indigo-500 focus:bg-white transition text-gray-700 font-medium">
          <option value="">載入資料夾中...</option>
        </select>
      </div>

      <div>
        <label class="block text-gray-700 font-bold mb-2 flex items-center">
          <span class="bg-indigo-100 text-indigo-700 text-xs px-2 py-0.5 rounded-full mr-2">步驟 2</span> 預計在幾天內背完
        </label>
        <div class="relative">
          <input type="number" id="target-days" min="1" value="7" class="w-full p-4 bg-gray-50 border border-gray-200 rounded-2xl focus:ring-2 focus:ring-indigo-500 focus:bg-white transition text-gray-700 font-medium">
          <span class="absolute right-4 top-4 text-gray-400 font-medium">天</span>
        </div>
      </div>

      <button onclick="generatePlan()" class="w-full bg-gradient-to-r from-indigo-600 to-blue-600 hover:from-indigo-700 hover:to-blue-700 text-white font-extrabold py-4 rounded-2xl shadow-lg shadow-indigo-200 transition-all transform active:scale-95 flex items-center justify-center space-x-2">
        <span>🚀</span>
        <span>生成今日背誦計畫</span>
      </button>
    </div>

    <!-- 計畫結果展示區 -->
    <div id="plan-result" class="hidden mt-8 pt-6 border-t border-gray-100">
      <div class="bg-indigo-50/70 border border-indigo-100 rounded-2xl p-4 mb-5 text-center">
        <h2 id="plan-title" class="text-base font-bold text-indigo-900"></h2>
      </div>

      <div class="flex justify-between items-center mb-3">
        <h3 class="font-bold text-gray-700 text-sm">📖 今日推薦複習單字</h3>
        <span class="text-xs text-gray-400">系統自動均分</span>
      </div>

      <!-- 單字列表 -->
      <div id="daily-words-container" class="space-y-3 max-h-96 overflow-y-auto pr-1">
        <!-- 動態產生 -->
      </div>
    </div>

  </div>

  <!-- Firebase 相關 SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
  <script src="js/plan.js"></script>
</body>
</html>
